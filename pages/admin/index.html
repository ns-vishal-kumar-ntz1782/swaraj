<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — SNPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/styles.css" />
  <link rel="stylesheet" href="admin-console.css" />
  <script src="../../assets/js/mockData.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>guardPage("admin-console");</script>
  <script src="../../assets/js/shared.js"></script>
</head>
<body>
  <div id="appRoot"></div>
  <script>
    // ES modules cannot be fetched over file://, so opening this file directly yields a
    // silent blank page. Catch that up front and say so, instead of leaving the screen blank.
    if (location.protocol === "file:") {
      document.getElementById("appRoot").innerHTML =
        '<div style="max-width:520px;margin:80px auto;padding:28px;border:1px solid #e5e7eb;border-radius:10px;font-family:Inter,sans-serif;color:#1f2937">' +
        '<h2 style="margin-top:0">This page needs to be served over HTTP</h2>' +
        '<p>Opening this file directly (file://) blocks the ES modules this console is built from. ' +
        'Run a local server from the project root, e.g. <code>python3 -m http.server 5173</code>, then open ' +
        '<code>http://localhost:5173/pages/admin/index.html</code>.</p></div>';
    }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
