<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Tracker — SNPD</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../assets/css/styles.css?v=2" />
  <link rel="stylesheet" href="portfolio.css" />
  <script src="../../assets/js/data/gate-skip.js"></script>
  <script src="../../assets/js/data/app-config.js"></script>
  <script src="../../assets/js/data/project-detail-seed.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script>guardPage("portfolio-tracker");</script>
</head>
<body>
  <div class="app-shell">
    <div id="topnav-root"></div>
    <div class="viewport-fit">
      <div class="pt-page">

        <!-- Page Header -->
        <div class="pt-header">
          <div class="pt-header-left">
            <h1 class="pt-title">Portfolio Tracker</h1>
            <p class="pt-subtitle">Project Development Dashboard</p>
          </div>
          <div class="pt-header-right">
            <div class="pt-filter-group">
              <span class="pt-filter-label">Category:</span>
              <select id="filterCategory" class="pt-select">
                <option value="">All</option>
                <option value="M2">M2</option>
                <option value="M4">M4</option>
                <option value="M6">M6</option>
              </select>
              <select id="filterPortfolio" class="pt-select">
                <option value="">All Portfolios</option>
                <option value="BB">BlockBuster</option>
                <option value="N-BB">Non-BlockBuster</option>
              </select>
            </div>
            
          </div>
        </div>

        <!-- Board: GATES column + category swimlanes -->
        <div class="pt-board-wrap">
          <div class="pt-board" id="boardTable"></div>
        </div>

        <!-- Legend Panel (collapsible, default open) -->
        <div class="pt-legend" id="legendPanel"></div>

      </div>
    </div>
  </div>

  <script src="../../assets/js/shared.js"></script>
  <script src="../../assets/js/chatbot.js?v=2"></script>
  <script src="portfolio.js"></script>
  <script>
    renderTopNav("portfolio-tracker");
    initPortfolioTracker();
  </script>
</body>
</html>
